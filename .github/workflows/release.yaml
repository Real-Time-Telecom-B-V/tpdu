# .github/workflows/release.yaml — publish to crates.io + PyPI + GitHub Release on tag.
#
# One tag → both registries, same version:
#   * verify-version — the git tag is the single source of truth; refuse to
#     publish if Cargo.toml's version doesn't match the tag.
#   * crates-io      — publish the Rust crate via OIDC Trusted Publishing.
#   * sdist + wheels — build the Python source dist and a wheel matrix
#     (manylinux / macOS / Windows; `--find-interpreter` picks up every CPython
#     in the build image, including the free-threaded `t` builds).
#   * pypi           — publish all wheels + sdist via PyPI Trusted Publishing.
#   * sbom + github-release — SPDX/CycloneDX SBOMs attached to the release.
#
# PREREQUISITES (one-time):
#   * crates.io: own `tpdu` and configure Trusted Publishing (OIDC) → this repo
#     + this workflow. The FIRST publish of a brand-new crate needs a one-shot
#     `publish-new`-scoped token (TP can't bootstrap a non-existent crate).
#   * PyPI: create the `tpdu` project's pending publisher → this repo, workflow
#     `release.yaml`, environment `pypi`.
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cargo version must equal the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')"
          echo "tag=$tag_version cargo=$cargo_version"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Cargo.toml version ($cargo_version) does not match tag ($tag_version)."
            exit 1
          fi

  crates-io:
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint a short-lived crates.io token via GitHub OIDC — no stored secret
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Authenticate to crates.io (OIDC Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  sdist:
    needs: verify-version
    # PyPI side is opt-in: set repo variable PUBLISH_PYPI=true once the PyPI
    # organisation/project is approved. Until then a tag publishes the crate to
    # crates.io only (the Rust side, which unblocks the dependent crate).
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist

  wheels:
    needs: verify-version
    if: vars.PUBLISH_PYPI == 'true'
    name: wheels ${{ matrix.platform.runner }}-${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
          - { runner: macos-13, target: x86_64 }
          - { runner: macos-14, target: aarch64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # --find-interpreter builds a wheel for every CPython found in the
          # build image, including the free-threaded (cp3xt) interpreters.
          args: --release --out dist --find-interpreter
          sccache: "true"
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  pypi:
    name: Publish to PyPI
    needs: [verify-version, sdist, wheels]
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) — no stored token
    steps:
      - name: Collect all dist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  sbom:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-sbom
        run: cargo install cargo-sbom
      - name: Generate SPDX + CycloneDX SBOMs
        run: |
          cargo sbom --output-format spdx_json_2_3 > "tpdu-${GITHUB_REF_NAME}.spdx.json"
          cargo sbom --output-format cyclone_dx_json_1_4 > "tpdu-${GITHUB_REF_NAME}.cdx.json"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            tpdu-*.spdx.json
            tpdu-*.cdx.json

  github-release:
    # Does not depend on the (optional) PyPI jobs so a crates.io-only release
    # still cuts the GitHub Release. Re-add `pypi` here if you want the release
    # gated on the wheels once PUBLISH_PYPI is enabled.
    needs: [crates-io, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@v7
      - name: Download SBOMs
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.spdx.json
            artifacts/*.cdx.json
